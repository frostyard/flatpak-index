name: Publish

# Rebuilds the remote from GHCR and deploys it to GitHub Pages. App
# repositories push images only; the index reads them anonymously, so it needs
# no credentials for other repositories. Apps dispatch this workflow after
# publishing (docs/runbooks/add-an-app.md, step 5). The schedule only catches up when
# they do not: GitHub delays and drops scheduled runs, so the hourly cron
# runs every 2 to 10 hours in practice (docs/design/overview.md). The index lists
# only digests with a valid attestation. The build fails if one has none, so
# the deploy job does not run and the last deployed site stays live.
#
# After the deploy, the verify job reads the live site back and runs a Flatpak
# client against it: a stale or broken Pages deploy fails there instead of on a
# user's machine. A red verify job does not undo the deploy.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-index.py --apps apps.json --site _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    name: Verify the live remote
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: _deployed

      - name: Unpack the deployed artifact
        run: mkdir _built && tar -xf _deployed/artifact.tar -C _built

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak

      - name: Check the live site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/check-live.py --site _built --url "$PAGE_URL"
