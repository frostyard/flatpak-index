name: Publish

# Rebuilds the remote from GHCR and deploys it to GitHub Pages. App
# repositories push images only; the index reads them anonymously, so it needs
# no credentials for other repositories. Apps dispatch this workflow after
# publishing (README, "Add an app", step 5). The schedule only catches up when
# they do not: GitHub delays and drops scheduled runs, so the hourly cron
# runs every 2 to 10 hours in practice (README). The index lists
# only digests with a valid attestation. The build fails if one has none, so
# the deploy job does not run and the last deployed site stays live.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-index.py --apps apps.json --site _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
